databases:
  - name: gaming-platform-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: gaming-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gaming-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PORT
        value: 8080
